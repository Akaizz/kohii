apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
// apply plugin: 'com.getkeepsafe.dexcount'

android {
  namespace 'kohii.v1'
  compileSdkVersion libs.versions.android.target.sdk.get().toInteger()

  defaultConfig {
    minSdkVersion libs.versions.android.min.sdk.get()
    targetSdkVersion libs.versions.android.target.sdk.get()

    buildConfigField("String", "LIB_NAME", "\"" + "Kohii, v" + libs.versions.release.name.get() + "\"")

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles 'consumer-rules.pro'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

configurations {
  all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
  implementation(libs.android.exoplayer.core)

  implementation(libs.androidx.appcompat)
  implementation(libs.androidx.core)
  implementation(libs.androidx.collection)
  implementation(libs.androidx.fragment)
  implementation(libs.androidx.recyclerview)
  implementation(libs.androidx.viewpager)
  implementation(libs.androidx.viewpager2)
  implementation(libs.androidx.coordinatorlayout)
  implementation(libs.androidx.lifecycle.process)
  implementation(libs.androidx.lifecycle.service)
  api(libs.androidx.lifecycle.java8)

  testImplementation(libs.junit)
  testImplementation(libs.androidx.junit.ktx)
  testImplementation(libs.robolectric)
  testImplementation(libs.mockito.kotlin)
  testImplementation(libs.androidx.core.ktx)
  testImplementation(libs.androidx.rules)
  testImplementation(libs.androidx.runner)

  testImplementation(libs.androidx.core.ktx)
  testImplementation(libs.androidx.rules)
  testImplementation(libs.androidx.runner)
  testImplementation(libs.androidx.junit.ktx)

  androidTestImplementation(libs.androidx.recyclerview)
  androidTestImplementation(libs.androidx.espresso.core)
}

// Doesn't work well with Kotlin
tasks.withType(Javadoc).all {
  enabled = false
}

project.archivesBaseName = "kohii-core"
apply from: rootProject.file('gradle/release_maven.gradle')
