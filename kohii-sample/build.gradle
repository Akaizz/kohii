apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
// apply plugin: 'com.getkeepsafe.dexcount'

if (file("google-services.json").exists()) {
  System.out.println("google-services.json found!")
  apply plugin: 'com.google.gms.google-services'
  apply plugin: 'com.google.firebase.crashlytics'
} else {
  System.out.println("google-services.json not found.")
}

android {
  namespace 'kohii.v1.sample'
  compileSdk libs.versions.android.compile.sdk.get().toInteger()

  signingConfigs {
    release {
      keyAlias kohii_prodKeyAlias
      keyPassword prodKeyPassword
      storeFile file(prodStoreFile)
      storePassword prodStorePassword
    }

    debug {
      keyAlias "debug"
      keyPassword "android"
      storeFile file("debug.jks")
      storePassword "android"
    }
  }

  defaultConfig {
    applicationId "kohii.v1.sample"
    minSdk libs.versions.android.min.sdk.get().toInteger()
    targetSdk libs.versions.android.target.sdk.get().toInteger()
    versionCode libs.versions.release.code.get().toInteger()
    versionName libs.versions.release.name.get()


    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    testApplicationId 'kohii.v1.sample.test'
  }

  buildTypes {

    release {
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    debug {
      applicationIdSuffix ".dev"
      signingConfig signingConfigs.debug
      // multiDexEnabled true
      minifyEnabled false
      shrinkResources false
    }
  }
  packaging {
    resources {
      excludes +=
          ['META-INF/services/javax.annotation.processing.Processor', 'META-INF/DEPENDENCIES']
    }
  }

  lint {
    // Sample code freely uses Media3 APIs annotated with @UnstableApi.
    disable 'UnsafeOptInUsageError'
  }

  buildFeatures {
    buildConfig true
    viewBinding true
    dataBinding true
  }

  productFlavors {}
}

configurations {
  all {
    exclude module: 'httpclient'
  }
}

dependencies {
  implementation project(':kohii-core')
  implementation project(':kohii-exoplayer')

  implementation(libs.androidx.media3.exoplayer)
  implementation(libs.androidx.media3.ui)

  implementation(libs.androidx.core)
  implementation(libs.androidx.fragment)
  implementation(libs.androidx.appcompat)
  implementation(libs.androidx.recyclerview)
  implementation(libs.androidx.recyclerview.selection)
  implementation(libs.androidx.constraintlayout)
  implementation(libs.androidx.material)

  implementation(libs.androidx.lifecycle.process)
  implementation(libs.androidx.lifecycle.runtime)
  implementation(libs.androidx.lifecycle.viewmodel)
  implementation(libs.androidx.lifecycle.livedata)
  implementation(libs.androidx.lifecycle.java8)

  implementation(libs.androidx.paging.common)
  implementation(libs.androidx.paging.runtime)

  implementation(libs.androidx.viewpager2)

  implementation(libs.square.moshi)
  kapt(libs.square.moshi.codegen)
  implementation(libs.okio)

  implementation(libs.glide)
  kapt(libs.compiler)
  implementation(libs.androidsvg.aar)

  implementation(libs.firebase.crashlytics.ktx) {
    transitive = true
  }

  implementation(libs.firebase.analytics)

  implementation(libs.timber)

  implementation(libs.square.leakcanary.plumber)
  debugImplementation(libs.square.leakcanary)

  testImplementation(libs.androidx.core.ktx)
  testImplementation(libs.androidx.rules)
  testImplementation(libs.androidx.runner)

  androidTestImplementation(libs.androidx.junit.ktx)
  androidTestImplementation(libs.androidx.espresso.core)
}
