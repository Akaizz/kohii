name: CI

on:
  pull_request:
  push:
    branches:
      - media3
      - dev-v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper and caches the Gradle files.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `check` runs ktlint, Android lint, unit tests and apiCheck (binary compatibility).
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace
